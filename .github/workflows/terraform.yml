{
  "name": "Reviewed Terraform deployment",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "environment": {
          "type": "choice",
          "options": [
            "dev",
            "prod"
          ],
          "default": "dev",
          "required": true
        },
        "image_tag": {
          "description": "Previously built immutable image tag",
          "required": true
        },
        "apply": {
          "type": "boolean",
          "default": false,
          "description": "Apply the saved plan after environment approval"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "id-token": "write"
  },
  "jobs": {
    "deployment": {
      "runs-on": "ubuntu-latest",
      "environment": "${{ inputs.environment }}",
      "env": {
        "TF_VAR_image_tag": "${{ inputs.image_tag }}",
        "TF_VAR_existing_oidc_provider_arn": "${{ vars.AWS_OIDC_PROVIDER_ARN }}",
        "TF_VAR_deploy_services": "${{ vars.DEPLOY_SERVICES || 'false' }}",
        "TF_VAR_deploy_airflow": "${{ vars.DEPLOY_AIRFLOW || 'false' }}",
        "TF_VAR_github_repository": "${{ github.repository }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "hashicorp/setup-terraform@v3",
          "with": {
            "terraform_version": "1.10.5"
          }
        },
        {
          "uses": "aws-actions/configure-aws-credentials@v4",
          "with": {
            "role-to-assume": "${{ vars.AWS_TERRAFORM_ROLE_ARN }}",
            "aws-region": "ap-south-1"
          }
        },
        {
          "run": "terraform -chdir=infra/environments/${{ inputs.environment }} init -backend-config=\"bucket=${{ vars.TF_STATE_BUCKET }}\" -backend-config=\"key=shoplakehouse/${{ inputs.environment }}/terraform.tfstate\" -backend-config=\"region=ap-south-1\" -backend-config=\"encrypt=true\" -backend-config=\"use_lockfile=true\"\nterraform -chdir=infra/environments/${{ inputs.environment }} plan -out=deployment.tfplan"
        },
        {
          "if": "${{ inputs.apply }}",
          "run": "terraform -chdir=infra/environments/${{ inputs.environment }} apply -input=false deployment.tfplan"
        }
      ]
    }
  }
}
