shoplakehouse:
  target: "{{ env_var('DBT_TARGET', 'postgres') }}"
  outputs:
    postgres:
      type: postgres
      host: "{{ env_var('ANALYTICS_DB_HOST', 'localhost') }}"
      port: "{{ env_var('ANALYTICS_DB_PORT', '5434') | int }}"
      user: "{{ env_var('ANALYTICS_DB_USER', 'analytics_admin') }}"
      password: "{{ env_var('ANALYTICS_DB_PASSWORD') }}"
      dbname: "{{ env_var('ANALYTICS_DB_NAME', 'shoplakehouse_analytics') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'development') }}"
      threads: 2
      sslmode: "{{ env_var('ANALYTICS_DB_SSLMODE', 'prefer') }}"
    athena:
      type: athena
      s3_staging_dir: "s3://{{ env_var('LAKE_BUCKET', 'shoplakehouse-local') }}/athena-results/"
      s3_data_dir: "s3://{{ env_var('LAKE_BUCKET', 'shoplakehouse-local') }}/gold/"
      region_name: "{{ env_var('AWS_DEFAULT_REGION', 'ap-south-1') }}"
      database: awsdatacatalog
      schema: "{{ env_var('DBT_SCHEMA', 'development') }}"
      work_group: "{{ env_var('ATHENA_WORKGROUP', 'shoplakehouse-dev') }}"
      threads: 2
      num_retries: 5
