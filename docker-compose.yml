name: shoplakehouse

services:
  source-postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SOURCE_DB_NAME:?Set SOURCE_DB_NAME in .env}
      POSTGRES_USER: ${SOURCE_DB_USER:?Set SOURCE_DB_USER in .env}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:?Set SOURCE_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    command: ["postgres", "-c", "timezone=UTC"]

    ports:
      - "127.0.0.1:${SOURCE_DB_PORT:-5433}:5432"

    volumes:
      - source_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  source_postgres_data: